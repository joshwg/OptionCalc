<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Calculator</title>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container-fluid oc-app py-2">

  <!-- ── Stock Info ────────────────────────────────────────────────────────── -->
  <div class="card mb-2">
    <div class="card-body py-2">

      <!-- Row 1: Ticker + action buttons + logout -->
      <div class="d-flex align-items-center gap-2 mb-2">
        <div style="position:relative" id="tickerWrap">
          <input type="text" class="form-control form-control-sm text-uppercase"
                 id="fTicker" placeholder="Ticker (e.g. AAPL)" autocomplete="off"
                 style="width:160px">
          <div id="suggestionsBox" class="oc-suggestions" style="display:none"></div>
        </div>
        <button class="btn btn-sm btn-primary" id="btnLoad"
                title="Fetch current price, dividend yield, earnings date, and option chain for this ticker">Load</button>
        <button class="btn btn-sm btn-outline-secondary" id="btnHistVol"
                title="Set volatility from 1-year historical data">Hist Vol</button>
        <a class="btn btn-sm btn-outline-secondary ms-auto" href="/logout"
           title="Log out">&#128682;</a>
      </div>

      <!-- Row 2: Stock price + company name + earnings -->
      <div class="d-flex align-items-center gap-3 mb-1 flex-wrap">
        <div class="d-flex align-items-center gap-1">
          <label class="form-label form-label-sm mb-0 text-nowrap" for="fPrice">
            Price ($)
          </label>
          <input type="number" class="form-control form-control-sm" id="fPrice"
                 step="0.01" min="0" style="width:85px" placeholder="0.00"
                 title="Current stock price. Auto-filled when a ticker is loaded; can be overridden manually to model hypothetical scenarios.">
        </div>
        <div id="lblCompany" class="fw-semibold small text-truncate">&nbsp;</div>
        <div class="small text-muted ms-auto text-nowrap">
          Earnings: <strong id="lblEarnings" class="text-dark">--</strong>
        </div>
      </div>

      <!-- Row 3: Status -->
      <div id="statusLine" class="mt-1"></div>

    </div>
  </div>

  <!-- ── Parameters + Quick View ───────────────────────────────────────────── -->
  <div class="row g-2 mb-2">

    <!-- Option Parameters -->
    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-header py-1 small fw-semibold">Option Parameters</div>
        <div class="card-body py-2">

          <!-- Call / Put -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm">Type</label>
            <div class="col-7">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="optType"
                       id="optCall" value="call" checked>
                <label class="form-check-label" for="optCall">Call</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="optType"
                       id="optPut" value="put">
                <label class="form-check-label" for="optPut">Put</label>
              </div>
            </div>
          </div>

          <!-- Expiration -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm"
                   for="fExpiration">Expiration</label>
            <div class="col-7 d-flex align-items-center gap-2">
              <select class="form-select form-select-sm" id="fExpiration"
                      style="flex:1"
                      title="Option expiration date. Choosing a new date auto-fills the nearest ATM strike and its implied volatility."></select>
              <div class="form-check mb-0 text-nowrap">
                <input class="form-check-input" type="checkbox" id="chkAllDates"
                       title="Show every available expiration date instead of only the next 6 months">
                <label class="form-check-label small" for="chkAllDates"
                       title="Show every available expiration date instead of only the next 6 months">All</label>
              </div>
            </div>
          </div>

          <!-- Strike -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm"
                   for="fStrike">Strike Price</label>
            <div class="col-7 d-flex align-items-center gap-1">
              <select class="form-select form-select-sm" id="fStrike"
                      style="flex:1"
                      title="Option strike price. Choosing a new strike auto-fills the implied volatility computed from the market bid/ask midpoint."></select>
              <input type="number" class="form-control form-control-sm" id="fStrikeCustom"
                     step="0.5" min="1" placeholder="custom"
                     style="width:74px"
                     title="Type any strike not in the list (overrides the dropdown)">
            </div>
          </div>

          <!-- Volatility -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm"
                   for="fVolatility">Volatility (σ) %</label>
            <div class="col-7">
              <input type="number" class="form-control form-control-sm" id="fVolatility"
                     step="0.1" min="0" max="1000" placeholder="e.g. 25.5"
                     title="Implied (or historical) volatility as a percentage — e.g. 25.5 means 25.5%. Auto-filled from the option chain when a strike is selected.">
            </div>
          </div>

          <!-- Risk-free rate -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm"
                   for="fRiskFree">Risk-Free Rate</label>
            <div class="col-7 d-flex align-items-center gap-1">
              <input type="number" class="form-control form-control-sm" id="fRiskFree"
                     step="0.001" min="0" max="1" placeholder="0.045"
                     style="width:80px" title="Decimal, e.g. 0.045 = 4.5%">
              <button class="btn btn-sm btn-outline-secondary py-0 px-1"
                      id="btnSaveConfig"
                      title="Save this risk-free rate as the default for future sessions">Save</button>
              <span id="cfgSavedMsg" class="small text-success"
                    style="display:none">✓</span>
            </div>
          </div>

          <!-- Dividend yield -->
          <div class="row mb-2 align-items-center">
            <label class="col-5 col-form-label col-form-label-sm"
                   for="fDividend">Dividend (q) %</label>
            <div class="col-7">
              <input type="number" class="form-control form-control-sm" id="fDividend"
                     step="0.01" min="0" max="100" placeholder="e.g. 0.50"
                     title="Annual dividend yield as a percentage — e.g. 1.5 means 1.5%. Auto-filled from Yahoo Finance when a ticker is loaded.">
            </div>
          </div>

          <!-- Calculated fair price + greeks -->
          <div class="row align-items-center mt-1">
            <label class="col-5 col-form-label col-form-label-sm">Fair Price</label>
            <div class="col-7">
              <strong id="lblCalcPrice" class="oc-price">--</strong>
            </div>
          </div>
          <div class="row align-items-center mt-1">
            <label class="col-5 col-form-label col-form-label-sm">Delta (Δ)</label>
            <div class="col-7">
              <span id="lblDelta" class="text-muted small">--</span>
            </div>
          </div>
          <div class="row align-items-center mt-1">
            <label class="col-5 col-form-label col-form-label-sm">Theta (Θ)</label>
            <div class="col-7">
              <span id="lblTheta" class="text-muted small">--</span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Quick View -->
    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-header py-1 small fw-semibold">
          Quick View — Next 3 Expirations
        </div>
        <div class="card-body py-2">
          <table class="table table-sm table-bordered mb-0" id="quickViewTable">
            <thead class="table-light">
              <tr>
                <th>Expiry</th>
                <th>Strike</th>
                <th>IV</th>
                <th>Fair Price</th>
              </tr>
            </thead>
            <tbody>
              <tr id="qrow0">
                <td id="qdate0">--</td>
                <td><input type="number" class="form-control oc-qstrike"
                           id="qstrike0" step="0.5" placeholder="--"
                           title="Override the strike price for this expiration, then press Enter to recalculate"></td>
                <td id="qiv0" title="At-the-money implied volatility fetched from the option chain">--</td>
                <td id="qprice0" title="Theoretical fair price using the ATM implied volatility for this expiration">--</td>
              </tr>
              <tr id="qrow1">
                <td id="qdate1">--</td>
                <td><input type="number" class="form-control oc-qstrike"
                           id="qstrike1" step="0.5" placeholder="--"
                           title="Override the strike price for this expiration, then press Enter to recalculate"></td>
                <td id="qiv1" title="At-the-money implied volatility fetched from the option chain">--</td>
                <td id="qprice1" title="Theoretical fair price using the ATM implied volatility for this expiration">--</td>
              </tr>
              <tr id="qrow2">
                <td id="qdate2">--</td>
                <td><input type="number" class="form-control oc-qstrike"
                           id="qstrike2" step="0.5" placeholder="--"
                           title="Override the strike price for this expiration, then press Enter to recalculate"></td>
                <td id="qiv2">--</td>
                <td id="qprice2">--</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /.row -->

  <!-- ── Actions + status ───────────────────────────────────────────────────── -->
  <div class="d-flex gap-2 mb-2 align-items-center">
    <button class="btn btn-sm btn-primary" id="btnCalculate"
            title="Run full American Binomial valuation and display the option price, time values, and all Greeks (Δ Γ Θ ν ρ)">
      Calculate Option Price
    </button>
  </div>

  <!-- ── Results ────────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header py-1 small fw-semibold">Results</div>
    <div class="card-body p-0">
      <pre id="resultsText" class="oc-results mb-0"></pre>
    </div>
  </div>

</div><!-- /.oc-app -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
